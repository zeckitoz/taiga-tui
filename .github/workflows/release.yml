name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The CI jobs on all three platforms, plus lint and checks.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the attestations and checksums.txt (cosign keyless)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the release notes from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3
      - name: Write the rpm signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/rpm-signing-key.asc"
          echo "RPM_SIGNING_KEY_FILE=$RUNNER_TEMP/rpm-signing-key.asc" >> "$GITHUB_ENV"
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The release checklist tags vX.Y.Z on the last RC commit. With two
          # tags on one commit GoReleaser would pick the RC from git describe
          # and try to upload it a second time.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          # Writes the Scoop bucket. Tags with a "-" are pre-releases, which
          # GoReleaser leaves out.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Attest artefacts
        uses: actions/attest-build-provenance@v4
        with:
          # checksums.txt names every archive and package.
          subject-checksums: dist/checksums.txt
      - name: Attest checksums.txt
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/checksums.txt

  # The Homebrew formula builds from source, so GoReleaser has nothing to
  # generate. Render it from packaging/homebrew, prove that it installs on
  # both platforms, and only then publish it to the tap. Pre-releases skip all
  # three jobs.
  formula-render:
    name: Render formula
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render
        run: |
          date=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd HEAD)
          mkdir formula
          packaging/homebrew/render.sh "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$date" > formula/taiga-tui.rb
          cat formula/taiga-tui.rb
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: formula
          path: formula/taiga-tui.rb

  formula-test:
    name: Formula (${{ matrix.os }})
    needs: formula-render
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          name: formula
          path: formula
      - name: Put Homebrew on the PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Test formula
        run: packaging/homebrew/test.sh formula/taiga-tui.rb

  formula-publish:
    name: Publish formula
    needs: formula-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: formula
          path: formula
      - uses: actions/checkout@v7
        with:
          repository: zeckitoz/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Commit to the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../formula/taiga-tui.rb Formula/taiga-tui.rb
          # Replaces the cask GoReleaser used to write. Same name, so both
          # side by side would make `brew install` ambiguous.
          git rm -q --ignore-unmatch Casks/taiga-tui.rb
          git add Formula/taiga-tui.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run of the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "Tap is already up to date."
            exit 0
          fi
          git commit -m "taiga-tui ${GITHUB_REF_NAME#v}"
          git push

  # The signed apt and rpm repository on GitHub Pages. It takes the packages
  # from the GitHub release, so the files are the ones checksums.txt and the
  # attestations name. Pre-releases skip it.
  linux-repo:
    name: Publish apt and rpm repository
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Two tags pushed in a row must not race on the same branch.
    concurrency:
      group: linux-repo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: zeckitoz/linux-repo
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: repo
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c gnupg
      - name: Download the packages of the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir pkgs \
            --pattern '*.deb' --pattern '*.rpm'
          ls -l pkgs
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # A short path: the agent sockets live in the directory.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build and sign the repository
        env:
          GPG_SIGNING_KEY: ${{ vars.GPG_SIGNING_KEY }}
        run: packaging/linux/build-repo.sh repo pkgs
      - name: Verify the signatures
        run: |
          gpg --batch --verify repo/dists/stable/InRelease
          gpg --batch --verify repo/dists/stable/Release.gpg repo/dists/stable/Release
          gpg --batch --verify repo/rpm/repodata/repomd.xml.asc repo/rpm/repodata/repomd.xml
      - name: Commit to the repository
        working-directory: repo
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run of the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "Repository is already up to date."
            exit 0
          fi
          git commit -m "taiga-tui ${GITHUB_REF_NAME#v}"
          git push
