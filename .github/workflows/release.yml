name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The CI jobs on all three platforms, plus lint and checks.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the attestations and checksums.txt (cosign keyless)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the release notes from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the Homebrew tap and the Scoop bucket. Tags with a "-" are
          # pre-releases, which GoReleaser leaves out of both.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Attest artefacts
        uses: actions/attest-build-provenance@v4
        with:
          # checksums.txt names every archive and package.
          subject-checksums: dist/checksums.txt
      - name: Attest checksums.txt
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/checksums.txt
